name: Build isolated D3D12 render probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Verify reviewed rendering test sources
        run: |
          cat <<'HASHES' | shasum -a 256 -c -
          f6c9d8bd9b41adf10b3bb100f541c302ef44c624c54ebf49dd4202e87de1549e  madeira-d3d12/tests/windows/cube_window.c
          3204c6f7e17063b1cbef8edb7ba649cd6a51bddd9ab4f14382c48751bb2ac974  madeira-d3d12/tests/windows/tri_dxil.h
          9ad4fc677f9d20c63acf857a97b68c4a9fd68ee3a885b5766d750db68cdf003a  madeira-d3d12/tests/windows/cube_geom.h
          da3eb05339c1197a4abb1d6982ff21e3ef8268620159ceff2c5ea0c326343f41  madeira-d3d12/tests/windows/root_sig.h
          31ac866d78e6b2b58099fd5a7ac0d75bf2f3bf8d7afe055864cbcf47d6f8ee69  madeira-d3d12/tests/windows/checker_tex.h
          HASHES
      - name: Download SHA-256-pinned compiler
        run: bash tools/build/setup-llvm-mingw.sh
      - name: Build one x64 Windows executable
        run: |
          mkdir -p dist
          toolchains/llvm-mingw-20260421-ucrt-macos-universal/bin/x86_64-w64-mingw32-clang \
            -O2 -Wall -mwindows -Wl,--no-insert-timestamp \
            -o dist/GalacWin-D3D12-render-probe-fixed.exe \
            madeira-d3d12/tests/windows/cube_window.c \
            -Imadeira-d3d12/tests/windows -luuid -lole32
          python3 - <<'PY'
          from pathlib import Path
          import struct
          data = Path('dist/GalacWin-D3D12-render-probe-fixed.exe').read_bytes()
          assert data[:2] == b'MZ' and len(data) < 2_000_000
          pe = struct.unpack_from('<I', data, 0x3c)[0]
          assert data[pe:pe + 4] == b'PE\0\0'
          assert struct.unpack_from('<H', data, pe + 4)[0] == 0x8664
          print('PASS: bounded x86-64 Windows PE')
          PY
          shasum -a 256 dist/GalacWin-D3D12-render-probe-fixed.exe
      - name: Encrypt the probe for local inspection
        run: |
          brew install age
          age -R .github/ipa-audit-recipient.txt \
            -o dist/GalacWin-D3D12-render-probe-fixed.exe.age \
            dist/GalacWin-D3D12-render-probe-fixed.exe
          shasum -a 256 dist/GalacWin-D3D12-render-probe-fixed.exe.age
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: GalacWin-D3D12-render-probe-fixed-encrypted
          path: dist/GalacWin-D3D12-render-probe-fixed.exe.age
          if-no-files-found: error
          retention-days: 7
