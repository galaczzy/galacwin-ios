name: Check source-built StikJIT

on:
  workflow_dispatch:
  push:
    branches: [jit-source-build]

permissions:
  contents: read

jobs:
  compile:
    runs-on: xcode-27
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Rebuild and stage StikJIT
        run: bash tools/build/build-stikjit-source.sh
      - name: Compile GalacWin helper against rebuilt StikJIT
        run: |
          xcodebuild -project app/Madeira.xcodeproj \
            -target MadeiraJITHelper -configuration Debug -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: StikJIT-source-build-check
          path: .jit-source/StikJIT/StikJIT.xcframework
          if-no-files-found: error
          retention-days: 1
